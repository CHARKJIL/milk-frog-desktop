<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>奶蛙 · 来陪你发呆</title><link rel="icon" href="milk-frog.png">
<style>
:root{font-family:"Microsoft YaHei",system-ui,sans-serif;color:#443b20;background:#faf6e9}*{box-sizing:border-box}body{margin:0}main{max-width:1060px;margin:auto;padding:36px 24px}header{display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:38px;letter-spacing:-2px;margin:4px 0 10px}p{line-height:1.8;color:#807454}small{letter-spacing:4px;color:#96824e}.tag{border:1px solid #e4d6ab;padding:9px 16px;border-radius:99px;font-size:13px;white-space:nowrap}.layout{display:grid;grid-template-columns:1.1fr 1fr;gap:32px;margin-top:30px}.stage{border:1px solid #eadfbd;min-height:490px;border-radius:32px;background:radial-gradient(ellipse at 50% 45%,#fffdf4,#f5ebcf);position:relative;display:grid;place-items:center;overflow:hidden}.pet{width:384px;height:416px;background-image:url('spritesheet.png');background-size:3072px 4576px;background-repeat:no-repeat;image-rendering:auto}.caption{position:absolute;bottom:18px;left:20px;color:#84764b;font-size:13px}.number{position:absolute;right:22px;top:20px;color:#ac9e73;font-size:12px}.panel{padding:26px 0}h2{font-size:22px;margin:0 0 10px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:24px 0}button{border:1px solid #e2d5af;border-radius:14px;padding:13px 6px;background:#fffaf0;color:#5c4c27;cursor:pointer;font:inherit;transition:background .2s,transform .2s}button:hover{background:#ffedb8;transform:translateY(-2px)}button[aria-pressed="true"]{background:#f8d96a;border-color:#ddba43;font-weight:600}.tools{display:flex;gap:12px;margin-top:20px}.tools button{padding:11px 20px}.note{font-size:13px;padding:16px;background:#f0ead8;border-radius:16px;line-height:1.8;color:#837453}footer{font-size:12px;color:#a19470;margin-top:32px}.error{display:none;color:#a63625;margin:18px}a{color:#786321}@media(max-width:760px){main{padding:24px 16px}.layout{grid-template-columns:1fr;gap:0}.stage{min-height:430px}.pet{transform:scale(.9)}.panel{padding:24px 0}h1{font-size:30px}.tag{display:none}}
</style></head><body><main>
<header><div><small>MILK FROG</small><h1>来，陪你发会儿呆。</h1><p>圆圆的、软软的，还有一点点呆。</p></div><span class="tag">你的黄色小搭子</span></header>
<section class="layout"><div class="stage" id="stage"><span class="number" id="stateName">安静待着</span><div class="pet" id="pet" role="img" aria-label="黄色奶蛙动画"></div><span class="caption">轻点右边的按钮，看看它的小动作</span></div>
<div class="panel"><h2>今天想怎么陪你？</h2><p>可以安静待着，也可以蹦跶一下。<br>选择“看看你”，把鼠标放到奶蛙周围试试。</p><div class="actions" id="actions"></div><div class="tools"><button id="pause">暂停一下</button><button id="gaze" aria-pressed="false">看看你</button></div><p class="error" id="error">没有找到动作图片。请将本页面与 spritesheet.png 放在同一文件夹。</p><div class="note">桌面上的奶蛙还能拖动、缩放和自由散步。启动上一级 windows 文件夹里的 MilkFrog.exe，就能让它陪你一起工作。</div></div></section>
<footer>以你提供的奶蛙形象为参考制作 · <a href="all-actions.gif">查看全部动作</a> · <a href="all-actions.mp4">播放动作视频</a></footer>
</main><script>
const states=[['安静待着',6],['向右散步',8],['向左散步',8],['挥挥小手',4],['轻轻一跳',5],['有点泄气',8],['等你一下',6],['认真思考',6],['仔细看看',6]];
const durations=[[280,110,110,140,140,320],[120,120,120,120,120,120,120,220],[120,120,120,120,120,120,120,220],[140,140,140,280],[140,140,140,140,280],[140,140,140,140,140,140,140,240],[150,150,150,150,150,260],[120,120,120,120,120,220],[150,150,150,150,150,280]];
let row=0,frame=0,paused=false,gaze=false,deadline=performance.now()+280;
const pet=document.getElementById('pet'),panel=document.getElementById('actions'),gazeButton=document.getElementById('gaze');
function paint(r,c){pet.style.backgroundPosition=`${-c*384}px ${-r*416}px`}
function select(index){row=index;frame=0;gaze=false;gazeButton.setAttribute('aria-pressed','false');deadline=performance.now()+durations[row][0];document.querySelectorAll('[data-state]').forEach((b)=>b.setAttribute('aria-pressed',Number(b.dataset.state)===row));document.getElementById('stateName').textContent=states[row][0];paint(row,frame)}
states.forEach(([name],index)=>{const b=document.createElement('button');b.textContent=name;b.dataset.state=index;b.setAttribute('aria-pressed',index===0);b.onclick=()=>select(index);panel.append(b)});
document.getElementById('pause').onclick=(e)=>{paused=!paused;e.target.textContent=paused?'继续陪你':'暂停一下'};
gazeButton.onclick=()=>{gaze=!gaze;gazeButton.setAttribute('aria-pressed',String(gaze));document.getElementById('stateName').textContent=gaze?'在看你呀':states[row][0]};
document.addEventListener('pointermove',(e)=>{if(!gaze||paused)return;const box=pet.getBoundingClientRect(),x=e.clientX-box.left-box.width/2,y=e.clientY-box.top-box.height*.18;if(Math.hypot(x,y)<20){paint(0,0);return}const angle=(Math.atan2(x,-y)*180/Math.PI+360)%360,index=Math.round(angle/22.5)%16;paint(9+Math.floor(index/8),index%8)});
function tick(now){if(!paused&&!gaze&&now>=deadline){frame=(frame+1)%states[row][1];paint(row,frame);deadline=now+durations[row][frame]}requestAnimationFrame(tick)}requestAnimationFrame(tick);
const image=new Image();image.onerror=()=>document.getElementById('error').style.display='block';image.src='spritesheet.png';
</script></body></html>
